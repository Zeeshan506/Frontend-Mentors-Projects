<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Tip calculator app</title>
    <style>
      * {
        font-family: "Space Mono", monospace;
      }
    </style>
    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body
    class="flex flex-col justify-center items-center lg:mt-0 mt-10 h-screen bg-[#c5e4e7] gap-10"
  >
    <div id="heading" class="">
      <p class="text-2xl text-[#3e6365] font-bold">S P L I <br />T T E R</p>
    </div>
    <div
      id="container"
      class="w-full lg:w-[55%] grid grid-cols-1 lg:grid-cols-2 gap-4 bg-white rounded-2xl"
    >
      <div class="order-1 p-4">
        <div
          class="bg-[#00474b] px-8 py-10 rounded-2xl h-full flex flex-col justify-between"
        >
          <div class="flex flex-col gap-10">
            <div class="flex flex-row justify-between items-center">
              <div class="flex flex-col">
                <p class="text-white">Tip Amount</p>
                <p class="text-gray-400 text-xs">/person</p>
              </div>
              <div class="text-[#22c3ac] text-5xl font-bold">
                $<span id="tipAmount">0.00</span>
              </div>
            </div>
            <div
              class="flex flex-row justify-between items-center lg:mb-0 mb-4"
            >
              <div class="flex flex-col">
                <p class="text-white">Total</p>
                <p class="text-gray-400 text-xs">/person</p>
              </div>
              <div class="text-[#22c3ac] text-5xl font-bold">
                $<span id="perPerson">0.00</span>
              </div>
            </div>
          </div>
          <div class="flex flex-col justify-end">
            <button
              class="text-[#00474b] font-bold bg-[#0d686d] px-4 py-3 rounded-lg hover:bg-[#26c2ad]"
              id="reset"
            >
              RESET
            </button>
          </div>
        </div>
      </div>
      <div class="flex flex-col gap-2 justify-evenly gap-8 p-8 w-full">
        <div class="relative flex flex-col mx-auto w-full">
          <p class="font-bold text-[#6f8082]">Bill</p>
          <input
            type="number"
            placeholder="0"
            class="w-full text-right bg-[#f3f8fb] rounded-lg text-xl font-bold text-[#00474b] outline-[#52a99a] px-4 py-3 [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
            id="bill"
          />
          <img
            src="/images/icon-dollar.svg"
            alt="icon-dollar"
            class="absolute top-10 left-5"
          />
        </div>
        <div class="flex flex-col gap-2">
          <p class="font-bold text-[#6f8082]">Select Tip %</p>
          <div
            class="grid lg:grid-cols-3 grid-cols-2 grid-rows-3 lg:grid-rows-2 gap-3"
          >
            <div
              class="bg-[#00474b] p-2 text-white text-xl rounded-lg font-semibold text-center hover:bg-[#26c2ad] hover:text-[#00474b] hover:cursor-pointer transition-all duration-400"
              id="tips"
            >
              5%
            </div>
            <div
              class="bg-[#00474b] p-2 text-white text-xl rounded-lg font-semibold text-center hover:bg-[#26c2ad] hover:text-[#00474b] hover:cursor-pointer transition-all duration-400"
              id="tips"
            >
              10%
            </div>
            <div
              class="bg-[#00474b] p-2 text-white text-xl rounded-lg font-semibold text-center hover:bg-[#26c2ad] hover:text-[#00474b] hover:cursor-pointer transition-all duration-400"
              id="tips"
            >
              15%
            </div>
            <div
              class="bg-[#00474b] p-2 text-white text-xl rounded-lg font-semibold text-center hover:bg-[#26c2ad] hover:text-[#00474b] hover:cursor-pointer transition-all duration-400"
              id="tips"
            >
              25%
            </div>
            <div
              class="bg-[#00474b] p-2 text-white text-xl rounded-lg font-semibold text-center hover:bg-[#26c2ad] hover:text-[#00474b] hover:cursor-pointer transition-all duration-400"
              id="tips"
            >
              50%
            </div>

            <input
              type="number"
              name="customAmount"
              id="customAmount"
              placeholder="Custom"
              class="text-center font-bold text-xl bg-[#f3f8fb] rounded-lg text-[#00474b] outline-[#52a99a] [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
            />
          </div>
        </div>
        <div class="flex flex-col">
          <div class="flex">
            <p class="font-bold text-[#6f8082]">Select Tip %</p>
            <p class="font-bold text-[#be8170] ml-auto hidden" id="error">
              Can't be zero
            </p>
          </div>
          <div class="relative">
            <input
              type="number"
              placeholder="0"
              class="w-full text-right bg-[#f3f8fb] rounded-lg text-[#00474b] text-xl font-bold outline-[#52a99a] px-4 py-3 [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
              id="people"
              value="1"
            />
            <img
              src="/images/icon-person.svg"
              alt="icon-person"
              class="absolute top-4 left-5 bg-[#f3f8fb]"
            />
          </div>
        </div>
      </div>
    </div>
    <script src="/index.js"></script>
  </body>
</html>
