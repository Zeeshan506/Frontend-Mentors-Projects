<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Frontend Mentor | Product preview card component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body
    style="font-family: 'Montserrat', sans-serif"
    class="flex justify-center items-center h-screen bg-[#f3eae3]"
  >
    <div
      class="flex flex-col w-[600px] rounded-2xl h-auto mx-4 bg-white mt-[300px] md:mt-4 md:flex-row"
    >
      <div
        class="w-full bg-[url('images/image-product-mobile.jpg')] bg-cover min-w-[440px] md:min-w-1 bg-center bg-no-repeat md:bg-cover rounded-t-2xl md:rounded-l-2xl min-h-[400px] md:w-1/2 md:h-auto md:bg-[url('images/image-product-desktop.jpg')]"
      ></div>
      <div class="w-full flex flex-col p-6 gap-2 md:w-1/2">
        <p class="tracking-[4px] text-sm font-light text-[#6c7289ff]">
          PERFUME
        </p>
        <h1
          style="font-family: 'Fraunces', serif; font-weight: 700"
          class="text-3xl tracking-wide leading-[1] my-4"
        >
          Gabrielle Essence <br />
          Eau De Parfum
        </h1>
        <p class="text-gray-600 mb-4">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="flex items-center mb-4 gap-3">
          <span
            class="font-bold text-3xl text-[#3c8067ff]"
            style="font-family: 'Fraunces', serif"
            >$149.99</span
          >
          <span class="line-through text-gray-400 ml-2 text-sm">$169.99</span>
        </div>
        <button
          class="bg-[#3c8067ff] flex flex-row text-white gap-4 py-4 px-4 justify-center rounded hover:bg-[#1b4133ff]"
        >
          <img src="/images/icon-cart.svg" alt="cart" class="w-5 h-5" />
          <p class="text-sm">Add to Cart</p>
        </button>
      </div>
    </div>

    <!-- Perfume Gabrielle Essence Eau De Parfum A floral, solar and voluptuous
    interpretation composed by Olivier Polge, Perfumer-Creator for the House of
    CHANEL. $149.99 $169.99 Add to Cart -->
  </body>
</html>
